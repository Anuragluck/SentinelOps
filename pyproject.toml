[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelops"
version = "0.1.0"
description = "Grounded, safety-first cloud incident triage and runbook resolution platform"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8", "pydantic-settings>=2.4"]

[project.optional-dependencies]
cloud = ["google-cloud-bigquery>=3.25", "google-cloud-storage>=2.18", "google-genai>=1.0", "psycopg[binary]>=3.2", "pgvector>=0.3", "sentence-transformers>=3.0", "opentelemetry-api>=1.27", "opentelemetry-sdk>=1.27", "opentelemetry-exporter-gcp-trace>=1.8"]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
